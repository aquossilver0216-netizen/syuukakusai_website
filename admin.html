<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>混雑状況 管理画面｜収穫祭</title>
  <link rel="icon" type="image/jpeg" href="13391d591499bd351fd114454b225c2cb4a6a75.jpg">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="logo.css">
  <style>
    .admin-page{min-height:100vh;padding:90px 7vw;background:#e7f0fb;color:#071a36}.admin-wrap{max-width:850px;margin:auto}.admin-back{color:#0d4fa8;font-size:12px;text-decoration:none}.admin-page h1{font-size:clamp(40px,7vw,80px);line-height:1;margin:55px 0 15px}.admin-page h1 span{display:block;margin-bottom:16px;color:#0d4fa8;font:11px "Archivo Black";letter-spacing:.2em}.admin-lead{color:#3c5880;line-height:1.8}.admin-form{margin-top:50px;padding:28px;background:#fff;border:1px solid #cbd7e8}.admin-row{display:grid;grid-template-columns:1fr 220px;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid #cbd7e8}.admin-row:last-child{border-bottom:0}.admin-row strong{font-size:16px}.admin-row small{display:block;color:#6d87aa;margin-top:5px}.admin-row select{padding:12px;border:1px solid #0d4fa8;background:#fff;color:#071a36;font:13px "Noto Sans JP",sans-serif}.admin-actions{display:flex;gap:10px;margin-top:25px}.admin-actions button{padding:13px 18px;border:1px solid #0d4fa8;background:#0d4fa8;color:#fff;font-weight:700;cursor:pointer}.admin-actions button[type=reset]{background:#fff;color:#0d4fa8}.admin-message{margin-top:20px;color:#0d4fa8;font-size:13px;min-height:20px}.admin-note{margin-top:40px;padding:18px;border-left:3px solid #0d4fa8;color:#3c5880;font-size:12px;line-height:1.8}.admin-home{display:inline-block;margin-top:35px;color:#0d4fa8;font-weight:700;text-decoration:none}
    @media(max-width:700px){.admin-page{padding:70px 6vw}.admin-row{grid-template-columns:1fr}.admin-row select{width:100%}}
  </style>
</head>
<body><main class="admin-page"><div class="admin-wrap">
  <a class="admin-back" href="index.html">← 収穫祭トップへ</a>
  <h1><span>STAFF TOOL / CROWD STATUS</span>混雑状況<br>管理画面</h1>
  <p class="admin-lead">会場スタッフ向けの更新画面です。エリアごとの状況を選んで保存すると、同じブラウザの公開サイトに反映されます。</p>
  <form class="admin-form" id="crowd-form">
    <label class="admin-row"><span><strong>正門・受付</strong><small>Entrance / Reception</small></span><select name="gate"><option value="COMING SOON">COMING SOON</option><option value="空いています">空いています</option><option value="やや混雑">やや混雑</option><option value="混雑">混雑</option><option value="受付停止">受付停止</option></select></label>
    <label class="admin-row"><span><strong>体育館</strong><small>Gym / Stage</small></span><select name="gym"><option value="COMING SOON">COMING SOON</option><option value="空いています">空いています</option><option value="やや混雑">やや混雑</option><option value="混雑">混雑</option><option value="入場制限">入場制限</option></select></label>
    <label class="admin-row"><span><strong>中庭・模擬店</strong><small>Yard / Food Market</small></span><select name="yard"><option value="COMING SOON">COMING SOON</option><option value="空いています">空いています</option><option value="やや混雑">やや混雑</option><option value="混雑">混雑</option><option value="販売終了">販売終了</option></select></label>
    <div class="admin-actions"><button type="submit">状況を保存する</button><button type="reset">リセット</button></div><p class="admin-message" id="admin-message" role="status"></p>
  </form>
  <p class="admin-note"><strong>注意：</strong>現在はブラウザ内保存（localStorage）です。複数のスタッフや来場者の端末へリアルタイム共有するには、後からFirebase等のデータベース接続を追加してください。</p>
  <a class="admin-home" href="index.html#crowd">公開サイトの混雑状況を見る ↗</a>
</div></main><script src="admin.js"></script></body></html>
