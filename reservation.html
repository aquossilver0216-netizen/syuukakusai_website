<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出し物の予約｜収穫祭 2026</title>
  <link rel="icon" type="image/jpeg" href="13391d591499bd351fd114454b225c2cb4a6a75.jpg">
  <link rel="stylesheet" href="style.css?v=20260824">
  <link rel="stylesheet" href="logo.css?v=20260824-gallery">
  <style>
    .reservation-page{min-height:100vh;padding:110px 7vw 90px;background:linear-gradient(135deg,#071a36,#0d4fa8);color:#fff}.reservation-wrap{max-width:900px;margin:auto}.reservation-back{color:#b9d7ff;text-decoration:none;font-size:12px}.reservation-page h1{font-size:clamp(44px,8vw,100px);line-height:1;margin:70px 0 20px}.reservation-page h1 span{display:block;color:#b9d7ff;font:12px "Archivo Black";letter-spacing:.2em;margin-bottom:18px}.reservation-lead{font-size:17px;line-height:1.9;color:#e7f0fb;max-width:580px}.reservation-status{display:inline-block;margin-top:34px;padding:10px 14px;border:1px solid #b9d7ff;color:#b9d7ff;font:11px "Archivo Black";letter-spacing:.12em}.reservation-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:70px}.reservation-card{padding:24px;min-height:210px;background:#fff;color:#071a36;position:relative}.reservation-card small{display:block;color:#0d4fa8;font:10px "Archivo Black";letter-spacing:.12em}.reservation-card h2{font-size:20px;margin:45px 0 10px}.reservation-card p{color:#587296;font-size:12px}.reservation-card::after{content:"COMING SOON";position:absolute;right:14px;top:14px;color:#0d4fa8;font:9px "Archivo Black";letter-spacing:.08em}.reservation-note{margin-top:56px;padding:24px;border:1px solid #ffffff55;color:#dbe8f8;line-height:1.8;font-size:13px}.reservation-note strong{color:#fff}.reservation-home{display:inline-block;margin-top:40px;padding:14px 20px;background:#fff;color:#071a36;text-decoration:none;font-weight:700}
    @media(max-width:700px){.reservation-page{padding:90px 6vw 60px}.reservation-page h1{margin-top:55px}.reservation-grid{grid-template-columns:1fr;margin-top:50px}.reservation-card{min-height:160px}.reservation-card h2{margin-top:35px}}
  </style>
</head>
<body>
  <main class="reservation-page"><div class="reservation-wrap">
    <a class="reservation-back" href="index.html">← 収穫祭トップへ</a>
    <h1><span>RESERVATION</span>出し物の予約</h1>
    <p class="reservation-lead">ステージ企画・体験企画の予約ページです。出し物と時間が決まり次第、こちらから予約受付を開始します。</p>
    <span class="reservation-status">COMING SOON / 受付準備中</span>
    <div class="reservation-grid"><article class="reservation-card"><small>STAGE</small><h2>ステージ企画</h2><p>出演内容・時間が決まり次第公開</p></article><article class="reservation-card"><small>EXPERIENCE</small><h2>体験企画</h2><p>教室企画の予約を予定しています</p></article><article class="reservation-card"><small>SPECIAL</small><h2>特別企画</h2><p>詳細は公式SNSでお知らせします</p></article></div>
    <div class="reservation-note"><strong>予約開始のお知らせ</strong><br>受付開始日時、対象企画、定員、当日の参加方法は決まり次第このページと公式SNSで案内します。</div>
    <a class="reservation-home" href="index.html">公式サイトに戻る ↗</a>
  </div></main>
</body>
</html>
